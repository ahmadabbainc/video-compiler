name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode keystore (if provided)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Unit tests and release build
        shell: bash
        run: ./gradlew testDebugUnitTest assembleRelease --console=plain --stacktrace 2>&1 | tee build.log

      - name: Show the error (only when the build fails)
        if: failure()
        shell: bash
        run: |
          MSG=$(grep -E "^e: |error:|FAILED|What went wrong|Execution failed|Caused by|Unresolved" -A3 build.log | head -c 3500 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Gradle failure::$MSG"

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/SRT-Studio-${GITHUB_REF_NAME//\//-}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SRT-Studio-apk
          path: dist/*.apk
